				<div>

                <p id="header">白美庭緣
                
                
                </p>
                <p id="paragraph">從過去到當下，足跡已經漸漸形成更清晰的世界，
									<br>以至未來，你所說的「白美庭」也會日漸清晰、描繪出來，
									<br>
									<br>那里是否留白般美麗的庭院？
									<br>	是否描繪著一片晴空白雲，將所愛的﹑所珍惜的所有——
									<br>	樹蔭、花開、飄香、流雲、曦月靜溢、音聲拂廊、溫情繞庭，
									<br>	以及遇見的美好，邀請到庭院里。
									<br>	飄來的花葉，響起的笑語，
									<br>	正是世界在呼吸的證明；
									<br>	光陰荏苒，一切都剛剛好。
									<br>又或許，是一方月色美麗的隱密世界？
									<br>
									<br>期待你的新消息，
									<br>不管是熟悉環境後的小喜悅，
									<br>或者短暫疲累時的小抒發，
									<br>亦或片言片語的小碎言，
									<br>以及各類的小分享……
									<br> 
									</p>
